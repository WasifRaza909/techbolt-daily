name: post-tech-news

on:
  schedule:
    # 1 post a day, timed for Pakistan's evening peak (PKT = UTC+5). GitHub can start runs 5-15 minutes
    # late, so it is set slightly early. The post lands at about 8:30 PM PKT.
    - cron: "15 15 * * *"  # 20:15 PKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-tech-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
      BRAND_NAME: ${{ vars.BRAND_NAME }}
      VARIABLE_SLIDES: ${{ vars.VARIABLE_SLIDES }}
      BRAND_ACCENT: ${{ vars.BRAND_ACCENT }}
      DRY_RUN: ${{ vars.DRY_RUN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate post
        run: python -m src.main generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit images (Instagram needs public URLs)
        if: vars.DRY_RUN == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posts
          git commit -m "Add post images" || true
          git pull --rebase
          git push

      - name: Publish to Instagram
        if: vars.DRY_RUN == 'false'
        run: python -m src.main publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_WEBHOOK_URL: ${{ secrets.PUBLISH_WEBHOOK_URL }}

      - name: Record posted story
        if: vars.DRY_RUN == 'false'
        run: |
          git add posted.json
          git commit -m "Update posted list" || true
          git pull --rebase
          git push

      - name: Save preview (dry run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            posts
            out
          if-no-files-found: ignore
